name: 응급실 데이터 수집

on:
  schedule:
    - cron: '*/15 * * * *'   # 15분마다 시작 시도 (밀려도 아래 반복이 커버)
  workflow_dispatch:          # 수동 실행 버튼

permissions:
  contents: write

# 새 실행이 시작되면 이전 실행을 넘겨받음 (중복 방지 + 자동 복구)
concurrency:
  group: fetch-er
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 2분 간격으로 20분간 반복 수집
        run: |
          API="https://apis.data.go.kr/B552657/ErmctInfoInqireService/getEmrrmRltmUsefulSckbdInfoInqire?serviceKey=1ae147a1907296a5c5fd16751a21b2f146381a4727784592ae9c235d8ac0263d&STAGE1=%EA%B2%BD%EC%83%81%EB%B6%81%EB%8F%84&pageNo=1&numOfRows=100"
          REPO="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

          mkdir -p out && cd out
          git init -q
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout -q -b data

          OK=0
          for i in $(seq 1 10); do
            if curl -sS --max-time 25 "$API" -o er.xml && grep -q "<item>" er.xml; then
              date -u +"수집시각: %Y-%m-%dT%H:%M:%SZ" > updated.txt
              git add er.xml updated.txt
              git commit -q --allow-empty -m "ER $(date -u +%H:%M)"
              if git push -f -q "$REPO" data; then
                echo "✅ ${i}회차 저장 완료 ($(date -u -d '+9 hours' +%H:%M) KST)"
                OK=$((OK+1))
              else
                echo "⚠️ ${i}회차 push 실패"
              fi
            else
              echo "⚠️ ${i}회차 API 응답 이상"
              head -c 200 er.xml || true
            fi

            if [ "$i" -lt 10 ]; then
              sleep 120
            fi
          done

          echo "─────────────"
          echo "총 ${OK}/10회 성공"
          if [ "$OK" -eq 0 ]; then
            echo "❌ 전부 실패 - API 키 또는 서버 확인 필요"
            exit 1
          fi
