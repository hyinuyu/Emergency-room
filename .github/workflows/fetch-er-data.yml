name: 응급실 데이터 수집

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-er
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 1분 간격으로 20분간 반복 수집
        run: |
          API="https://apis.data.go.kr/B552657/ErmctInfoInqireService/getEmrrmRltmUsefulSckbdInfoInqire?serviceKey=1ae147a1907296a5c5fd16751a21b2f146381a4727784592ae9c235d8ac0263d&STAGE1=%EA%B2%BD%EC%83%81%EB%B6%81%EB%8F%84&pageNo=1&numOfRows=100"
          REPO="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

          # 3개 병원만 뽑아 아주 작은 JSON으로 만드는 스크립트
          cat > /tmp/parse.py << 'PYEOF'
          import xml.etree.ElementTree as ET, json, sys, datetime

          def num(item, tag):
              el = item.find(tag)
              if el is None or el.text is None: return None
              try: return int(el.text.strip())
              except: return None

          tree = ET.parse('/tmp/er.xml')
          out = {'collected': datetime.datetime.utcnow().strftime('%Y-%m-%dT%H:%M:%SZ'), 'h': {}}

          for item in tree.iter('item'):
              nm = item.find('dutyName')
              if nm is None or not nm.text: continue
              name = nm.text.replace(' ', '')
              key = None
              if '구미차' in name or '차의과학' in name: key = 'cha'
              elif '강동' in name: key = 'gangdong'
              elif '순천향' in name and '구미' in name: key = 'sch'
              if not key: continue
              hd = item.find('hvidate')
              out['h'][key] = {
                  'a':  num(item, 'hvec'),    # 일반 가용
                  't':  num(item, 'hvs01'),   # 일반 총
                  'pa': num(item, 'hv28'),    # 소아 가용
                  'pt': num(item, 'hvs02'),   # 소아 총
                  'd':  (hd.text.strip() if hd is not None and hd.text else None)
              }

          if 'cha' not in out['h']:
              print('구미차병원 없음', file=sys.stderr); sys.exit(1)

          json.dump(out, open('/tmp/er.json','w'), ensure_ascii=False, separators=(',',':'))
          print('OK', out['h'].keys())
          PYEOF

          mkdir -p out && cd out
          git init -q
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout -q -b data

          OK=0
          for i in $(seq 1 20); do
            if curl -sS --max-time 25 "$API" -o /tmp/er.xml && grep -q "<item>" /tmp/er.xml; then
              if python3 /tmp/parse.py; then
                cp /tmp/er.json er.json
                cp /tmp/er.xml er.xml
                date -u +"수집시각: %Y-%m-%dT%H:%M:%SZ" > updated.txt
                git add er.json er.xml updated.txt
                git commit -q --allow-empty -m "ER $(date -u +%H:%M)"
                if git push -f -q "$REPO" data; then
                  echo "✅ ${i}회차 저장 ($(wc -c < er.json) bytes)"
                  OK=$((OK+1))
                else
                  echo "⚠️ ${i}회차 push 실패"
                fi
              else
                echo "⚠️ ${i}회차 파싱 실패"
              fi
            else
              echo "⚠️ ${i}회차 API 응답 이상"
            fi

            if [ "$i" -lt 20 ]; then sleep 60; fi
          done

          echo "─────────────"
          echo "총 ${OK}/20회 성공"
          [ "$OK" -eq 0 ] && exit 1 || exit 0
